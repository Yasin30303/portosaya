<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Nocturnal Navy -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1320"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="termGlow" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0"/>
    </radialGradient>

    <!-- Chevron Gradient: Cyan Sky to Electric Blue -->
    <linearGradient id="promptGrad" gradientUnits="userSpaceOnUse" x1="100" y1="150" x2="250" y2="360">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#termBg)"/>
  <rect width="512" height="512" rx="128" fill="url(#termGlow)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#1E293B" stroke-width="6"/>

  <!-- Subtle Developer Grid Lines -->
  <g opacity="0.10" stroke="#38BDF8" stroke-width="2">
    <line x1="60" y1="170" x2="452" y2="170" stroke-dasharray="4 8"/>
    <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 8"/>
    <line x1="60" y1="342" x2="452" y2="342" stroke-dasharray="4 8"/>
  </g>

  <!-- Developer Prompt Chevron '>' -->
  <path d="M 112 155 L 236 256 L 112 357" fill="none" stroke="url(#promptGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Prompt Underscore '_' (Warm Cream Contrast) -->
  <rect x="276" y="332" width="134" height="50" rx="24" fill="#FAF4E1"/>
</svg>