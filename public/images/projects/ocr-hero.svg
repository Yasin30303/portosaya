<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080616"/>
      <stop offset="50%" stop-color="#11102A"/>
      <stop offset="100%" stop-color="#1A1953"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F2FE4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7777FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#7777FF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(60, 50)">
    <rect width="320" height="32" rx="6" fill="#11102A" stroke="#24224A" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#2F2FE4"/>
    <text x="32" y="21" font-family="monospace" font-size="12" fill="#B7B5CE" letter-spacing="1.5">RESEARCH ARCHITECTURE // HTR</text>
  </g>

  <text x="60" y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#F5F4FF">CNN-BiLSTM-CTC Pipeline</text>
  <text x="60" y="155" font-family="system-ui, sans-serif" font-size="15" fill="#85829F">Offline Indonesian Handwriting Text Recognition Architecture</text>

  <!-- Stage 1: Input Image -->
  <g transform="translate(60, 210)">
    <rect width="180" height="260" rx="12" fill="#11102A" stroke="#24224A" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">STAGE 01</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F5F4FF">Input Image</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#85829F">32 × 128 Normalized</text>
    
    <!-- Handwriting preview box -->
    <rect x="20" y="110" width="140" height="90" rx="6" fill="#080616" stroke="#24224A"/>
    <path d="M 35 165 C 45 135, 55 130, 60 160 C 65 170, 75 135, 85 155 C 95 140, 105 145, 120 150 C 130 155, 140 140, 145 155" fill="none" stroke="#F5F4FF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="20" y="235" font-family="monospace" font-size="10" fill="#B7B5CE">Adaptive Otsu Preproc</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(255, 330)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#2F2FE4" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#2F2FE4"/>
  </g>

  <!-- Stage 2: 7-Layer CNN Feature Extractor -->
  <g transform="translate(310, 190)">
    <rect width="220" height="300" rx="12" fill="#11102A" stroke="#24224A" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">STAGE 02</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F5F4FF">7-Layer Deep CNN</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#85829F">Spatial Feature Extraction</text>

    <!-- CNN layers visual stack -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#1A1953" stroke="#2F2FE4" stroke-width="1"/>
      <text x="12" y="17" font-family="monospace" font-size="10" fill="#F5F4FF">Conv2D (64) + LeakyReLU</text>

      <rect x="0" y="34" width="180" height="26" rx="4" fill="#1A1953" stroke="#2F2FE4" stroke-width="1"/>
      <text x="12" y="51" font-family="monospace" font-size="10" fill="#F5F4FF">MaxPool2D (2x2)</text>

      <rect x="0" y="68" width="180" height="26" rx="4" fill="#1A1953" stroke="#2F2FE4" stroke-width="1"/>
      <text x="12" y="85" font-family="monospace" font-size="10" fill="#F5F4FF">Conv2D (128) + BatchNorm</text>

      <rect x="0" y="102" width="180" height="26" rx="4" fill="#1A1953" stroke="#2F2FE4" stroke-width="1"/>
      <text x="12" y="119" font-family="monospace" font-size="10" fill="#F5F4FF">Conv2D (256) + BatchNorm</text>

      <rect x="0" y="136" width="180" height="26" rx="4" fill="#2F2FE4" opacity="0.4"/>
      <rect x="0" y="136" width="180" height="26" rx="4" fill="none" stroke="#7777FF" stroke-width="1"/>
      <text x="12" y="153" font-family="monospace" font-size="10" fill="#F5F4FF">Feature Map Transpose</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(545, 330)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#2F2FE4" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#2F2FE4"/>
  </g>

  <!-- Stage 3: Bidirectional LSTM -->
  <g transform="translate(595, 190)">
    <rect width="240" height="300" rx="12" fill="#11102A" stroke="#2F2FE4" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="240" height="300" rx="12" fill="#11102A" stroke="#2F2FE4" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">STAGE 03</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F5F4FF">Stacked BiLSTM</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#85829F">Bidirectional Context</text>

    <g transform="translate(20, 110)">
      <!-- Forward LSTM -->
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#1A1953" stroke="#24224A"/>
      <text x="12" y="24" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">FORWARD RECURRENCE (->)</text>
      <text x="12" y="46" font-family="monospace" font-size="10" fill="#B7B5CE">Left-to-Right Stroke Flow</text>

      <!-- Backward LSTM -->
      <rect x="0" y="70" width="200" height="60" rx="6" fill="#1A1953" stroke="#24224A"/>
      <text x="12" y="94" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">BACKWARD RECURRENCE (&#60;-)</text>
      <text x="12" y="116" font-family="monospace" font-size="10" fill="#B7B5CE">Right-to-Left Context Flow</text>

      <rect x="0" y="140" width="200" height="28" rx="4" fill="#080616" stroke="#2F2FE4"/>
      <text x="12" y="158" font-family="monospace" font-size="10" fill="#F5F4FF">Linear Projection (80 Vocab)</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(850, 330)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#2F2FE4" stroke-width="2"/>
    <polygon points="35,-4 43,0 35,4" fill="#2F2FE4"/>
  </g>

  <!-- Stage 4: CTC Loss & Output -->
  <g transform="translate(900, 210)">
    <rect width="240" height="260" rx="12" fill="#11102A" stroke="#24224A" stroke-width="1.5"/>
    <text x="20" y="35" font-family="monospace" font-size="11" fill="#7777FF" font-weight="bold">STAGE 04</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F5F4FF">CTC Transcription</text>
    <text x="20" y="80" font-family="monospace" font-size="11" fill="#85829F">Greedy Sequence Decoder</text>

    <!-- CTC sequence output box -->
    <rect x="20" y="110" width="200" height="65" rx="6" fill="#080616" stroke="#2F2FE4" stroke-width="1.5"/>
    <text x="30" y="132" font-family="monospace" font-size="9" fill="#85829F">COLLAPSED ALIGNMENT:</text>
    <text x="30" y="157" font-family="monospace" font-size="18" font-weight="700" fill="#F5F4FF" letter-spacing="3">"Bandung"</text>

    <text x="20" y="215" font-family="monospace" font-size="10" fill="#B7B5CE">Evaluation: CER &amp; WER</text>
    <text x="20" y="235" font-family="monospace" font-size="10" fill="#7777FF">&#10003; PyTorch Model Defended</text>
  </g>

  <!-- Footer Metadata line -->
  <g transform="translate(60, 615)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#85829F">FRAMEWORK: PYTORCH 2.X</text>
    <text x="240" y="0" font-family="monospace" font-size="11" fill="#85829F">OPTIMIZER: ADAMW</text>
    <text x="440" y="0" font-family="monospace" font-size="11" fill="#85829F">LOSS: CTC_LOSS</text>
    <text x="640" y="0" font-family="monospace" font-size="11" fill="#85829F">METRICS: CER / WER</text>
    <text x="880" y="0" font-family="monospace" font-size="11" fill="#7777FF">UNIKOM SKRIPSI 2026</text>
  </g>
</svg>

